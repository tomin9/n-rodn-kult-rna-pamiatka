<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sídlisko Píly — pasport budov</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&display=swap" rel="stylesheet">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!--
  Štýly a logika appky žijú v jednom spoločnom mieste, ktoré používa aj
  WordPress plugin (wordpress-plugin/sidlisko-pily/) — žiadna kópia kódu.
-->
<link rel="stylesheet" href="wordpress-plugin/sidlisko-pily/app.css">

<div class="sidlisko-pily-app">
  <header>
    <h1>Sídlisko Píly</h1>
    <span class="sub">pasport budov a priečelí · georeferencovaná mapa (Mapbox)</span>
    <span class="spacer"></span>
    <button class="tool" data-tab="prehlad" aria-pressed="true">Prehľad</button>
    <button class="tool" data-tab="budovy" aria-pressed="false">Budovy</button>
    <button class="tool" data-tab="umelci" aria-pressed="false">Umelci</button>
    <button class="tool" data-tab="motivy" aria-pressed="false">Motívy</button>
  </header>

  <main>
    <div id="sp-viewport">
      <div id="sp-map"></div>
      <div class="geobadge">WGS84 · mapbox://styles/tomin9/cle5ygem4004h01qge9x73z3q</div>
      <div class="mapnote" id="sp-mapnote"></div>
    </div>
    <aside id="sp-panel"></aside>
  </main>
</div>

<script src="wordpress-plugin/sidlisko-pily/app.js"></script>
